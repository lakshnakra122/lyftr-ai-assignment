services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-sk-dummy-key-1,sk-dummy-key-2}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.0-flash}
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
    volumes:
      - app_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  app_data:
